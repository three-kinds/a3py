[project]
name = "a3py"
dynamic = ["version"]
requires-python = ">= 3.11"
dependencies = [
    "ujson>=5.2.0",
]
authors = [
  {name = "three-kinds", email = "3179158552@qq.com"},
]
description = "a3py is a python toolkit."
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/three-kinds/a3py"
Source = "https://github.com/three-kinds/a3py"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "a3py.__version__"}

[tool.setuptools.packages.find]
include = ["a3py*"]

[tool.coverage.run]
source = ["a3py"]
parallel = false
sigterm = false


[tool.mypy]
packages = [
    "a3py",
    "tests"
]
disable_error_code = [
]

[tool.ruff]
src = [
    "a3py",
    "tests"
]
line-length = 120

[dependency-groups]
dev = [
    "coverage>=7.15.0",
    "mypy>=2.1.0",
    "poethepoet>=0.47.1",
    "ruff>=0.15.20",
    "types-ujson>=5.10.0.20250822",
]

[tool.poe.executor]
type = "uv"

[tool.poe.tasks.lint]
sequence = [
    { cmd = "ruff check" },
    { cmd = "mypy" }
]

[tool.poe.tasks.test-py311]
cmd = "python -m unittest"
executor = {isolated = true, python = "3.11"}

[tool.poe.tasks.test-py312]
cmd = "python -m unittest"
executor = {isolated = true, python = "3.12"}

[tool.poe.tasks.test-py313]
cmd = "python -m unittest"
executor = {isolated = true, python = "3.13"}

[tool.poe.tasks.test-py314]
cmd = "python -m unittest"
executor = {isolated = true, python = "3.14"}


[tool.poe.tasks.test-all]
sequence = ["test-py311", "test-py312", "test-py313", "test-py314"]
